<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUL-LORA Platform | Material 3 Healthcare Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --md-sys-color-primary: hsl(172, 85%, 45%);
        --md-sys-color-on-primary: hsl(172, 100%, 8%);
        --md-sys-color-primary-container: hsl(172, 75%, 14%);
        --md-sys-color-on-primary-container: hsl(172, 90%, 82%);
        --md-sys-color-secondary: hsl(210, 90%, 65%);
        --md-sys-color-tertiary: hsl(340, 85%, 65%);
        --md-sys-color-surface: hsl(230, 25%, 8%);
        --md-sys-color-surface-container: hsl(230, 20%, 14%);
        --md-sys-color-surface-container-high: hsl(230, 18%, 18%);
        --md-sys-color-outline: hsla(230, 20%, 60%, 0.15);
      }
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: hsl(230, 25%, 8%);
        color: #f3f4f6;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
